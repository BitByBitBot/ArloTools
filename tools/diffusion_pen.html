<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Color-Carrying Reaction-Diffusion + Export</title><style>html,body{margin:0;height:100%;display:flex;flex-direction:column;background:#000;color:#fff;font-family:monospace}#controls{padding:8px;border-bottom:1px solid #fff;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#111}canvas{flex:1;display:block;cursor:crosshair;background:#000}</style></head><body><div id='controls'><button id='play'>▶</button><button id='step'>Step</button><button id='reset'>Reset</button><button id='clear'>Clear</button><button id='export'>Export Image</button><label>Brush<input id='brush' type='range' min='1' max='30' value='5'></label><label>Feed F<input id='f' type='range' min='0' max='0.1' step='0.001' value='0.037'></label><label>Kill K<input id='k' type='range' min='0' max='0.1' step='0.001' value='0.06'></label><label>Iter<input id='iter' type='range' min='1' max='50' step='1' value='10'></label><div id='presets'></div></div><canvas id='cv'></canvas><script>const c=cv.getContext('2d'),dpr=devicePixelRatio||1;let W,H,U,V,U2,V2,R,G,B,playing=false;const presets=[{n:'Stripes',F:0.037,K:0.06},{n:'Spots',F:0.022,K:0.051},{n:'Maze',F:0.029,K:0.057},{n:'Worms',F:0.04,K:0.065},{n:'Clouds',F:0.014,K:0.045}];const pbox=document.getElementById('presets');presets.forEach(p=>{let b=document.createElement('button');b.textContent=p.n;b.onclick=()=>{f.value=p.F;k.value=p.K;};pbox.appendChild(b)});function resize(){W=Math.floor(innerWidth/2);H=Math.floor((innerHeight-60)/2);cv.width=W*dpr*2;cv.height=H*dpr*2;c.setTransform(dpr*2,0,0,dpr*2,0,0);U=new Float32Array(W*H).fill(1);V=new Float32Array(W*H);U2=new Float32Array(W*H);V2=new Float32Array(W*H);R=new Float32Array(W*H);G=new Float32Array(W*H);B=new Float32Array(W*H);}resize();addEventListener('resize',resize);function lap(a,x,y){const i=x+y*W;const g=(X,Y)=>a[((X+W)%W)+((Y+H)%H)*W];return g(x-1,y)+g(x+1,y)+g(x,y-1)+g(x,y+1)-4*a[i];}function step(){const F=+f.value,K=+k.value,Du=0.16,Dv=0.08;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=x+y*W;const u=U[i],v=V[i];const du=Du*lap(U,x,y)-u*v*v+F*(1-u);const dv=Dv*lap(V,x,y)+u*v*v-(F+K)*v;U2[i]=u+du;V2[i]=v+dv;let mix=(v>0.5)?0.3:0.05;R[i]+=mix*lap(R,x,y);G[i]+=mix*lap(G,x,y);B[i]+=mix*lap(B,x,y);}U.set(U2);V.set(V2);}function render(){const img=c.createImageData(W,H);for(let i=0;i<W*H;i++){let val=(V[i]-U[i])*3;val=Math.max(-1,Math.min(1,val));let r=Math.min(255,Math.max(0,R[i]+(val+0.5)*180)),g=Math.min(255,Math.max(0,G[i]+(val+0.5)*180)),b=Math.min(255,Math.max(0,B[i]+(val+0.5)*180));img.data[i*4]=r;img.data[i*4+1]=g;img.data[i*4+2]=b;img.data[i*4+3]=255;}const off=document.createElement('canvas');off.width=W;off.height=H;off.getContext('2d').putImageData(img,0,0);c.imageSmoothingEnabled=false;c.drawImage(off,0,0,cv.width/dpr/2,cv.height/dpr/2);}function tick(){if(playing)for(let i=0;i<+iter.value;i++)step();render();requestAnimationFrame(tick);}tick();document.getElementById('export').onclick=()=>{const link=document.createElement('a');link.download='reaction_diffusion.png';link.href=cv.toDataURL('image/png');link.click();};let drawing=false;let color=[1,0,0];document.addEventListener('keydown',e=>{if(e.key==='1')color=[1,0,0];if(e.key==='2')color=[0,1,0];if(e.key==='3')color=[0,0,1];if(e.key==='4')color=[1,1,0];if(e.key==='5')color=[0,1,1];if(e.key==='6')color=[1,0,1];});cv.onpointerdown=e=>{drawing=true;draw(e)};cv.onpointerup=()=>drawing=false;cv.onpointermove=e=>drawing&&draw(e);function draw(e){const rect=cv.getBoundingClientRect();const x=Math.floor((e.clientX-rect.left)/(rect.width)*W),y=Math.floor((e.clientY-rect.top)/(rect.height)*H),r=+brush.value;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){if(i*i+j*j<=r*r){const X=x+i,Y=y+j;if(X>=0&&Y>=0&&X<W&&Y<H){const idx=X+Y*W;U[idx]=0.3;V[idx]=1;R[idx]=color[0]*255;G[idx]=color[1]*255;B[idx]=color[2]*255;}}}render();}play.onclick=()=>playing=!playing;step.onclick=step;reset.onclick=()=>{U.fill(1);V.fill(0);R.fill(0);G.fill(0);B.fill(0);render()};clear.onclick=()=>{U.fill(1);V.fill(0);R.fill(0);G.fill(0);B.fill(0);render()};</script></body></html>
