<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ArloTool – Archive Audio Shuffle</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #000;
    }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .header {
      padding: 12px;
      border-bottom: 2px solid #000;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }
    .title {
      font-weight: 700;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .badge {
      border: 1px solid #000;
      padding: 2px 6px;
      font-size: 10px;
      text-transform: uppercase;
    }
    .main { display: flex; flex: 1; min-height: 0; }
    .controls {
      width: 260px;
      border-right: 2px solid #000;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .controls label {
      font-size: 11px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }
    .controls input[type="text"],
    .controls input[type="number"],
    .controls select {
      width: 100%;
      border: 1px solid #000;
      padding: 4px 6px;
      font-size: 12px;
      background: #fff;
      color: #000;
    }
    .controls .field {
      border-bottom: 1px solid #000;
      padding-bottom: 8px;
      margin-bottom: 4px;
    }
    button {
      border: 2px solid #000;
      background: #fff;
      padding: 6px 10px;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:active { transform: translate(1px, 1px); }
    button[disabled] { opacity: 0.4; cursor: default; }
    .status { font-size: 11px; min-height: 1.5em; }
    .content { flex: 1; display: flex; flex-direction: column; }
    .sample-meta {
      padding: 12px;
      border-bottom: 2px solid #000;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: 8px;
      column-gap: 24px;
      font-size: 12px;
    }
    .sample-title { font-weight: 700; text-transform: uppercase; }
    .sample-desc {
      font-size: 11px;
      line-height: 1.4;
      max-height: 6em;
      overflow: auto;
      border-top: 1px solid #000;
      padding-top: 4px;
      white-space: pre-wrap;
    }
    .sample-tags { font-size: 10px; text-transform: uppercase; }
    .audio-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 16px;
    }
    .audio-area-inner {
      border: 2px solid #000;
      padding: 16px 20px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    audio { width: 100%; margin-top: 8px; }
    .small-label { font-size: 10px; text-transform: uppercase; margin-bottom: 4px; }
    .links {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .code {
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      padding: 2px 4px;
      border: 1px solid #000;
      background: #fff;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">ArloTool: Archive Audio Shuffle</div>
    <div class="badge">Internet Archive Sampler</div>
  </div>
  <div class="main">
    <section class="controls">
      <div class="field">
        <label for="keyword">Keyword filter</label>
        <input id="keyword" type="text" placeholder="e.g. drums, choir, 1974" />
      </div>
      <div class="field">
        <label for="max-minutes">Max runtime (minutes)</label>
        <input id="max-minutes" type="number" min="0" step="1" value="8" />
      </div>
      <div class="field">
        <label>Licensing</label>
        <select id="license-filter">
          <option value="any">Any license</option>
          <option value="cc">Try for Creative Commons-ish</option>
        </select>
      </div>
      <div class="field">
        <label>Random start window (seconds)</label>
        <input id="start-window" type="number" min="0" step="5" value="30" />
      </div>
      <div class="field">
        <button id="new-sample-btn">New random sample</button>
      </div>
      <div class="field">
        <button id="randomize-start-btn">Randomize start in current track</button>
      </div>
      <div class="status" id="status">Idle.</div>
      <div style="font-size:10px; text-transform:uppercase; margin-top:auto; border-top:1px solid #000; padding-top:6px;">
        <div>Tips:</div>
        <ul style="padding-left:16px; margin:4px 0;">
          <li>Use keywords to bias genres / instruments.</li>
          <li>Shorter max runtime = more bite-sized samples.</li>
          <li>Hit "Randomize start" while it plays.</li>
        </ul>
      </div>
    </section>

    <section class="content">
      <div class="sample-meta">
        <div>
          <div class="sample-title" id="sample-title">No item loaded yet.</div>
          <div id="sample-creator"></div>
          <div id="sample-year"></div>
        </div>
        <div>
          <div class="sample-tags" id="sample-tags"></div>
          <div class="sample-desc" id="sample-desc"></div>
        </div>
      </div>
      <div class="audio-area">
        <div class="audio-area-inner">
          <div class="small-label">Current sample</div>
          <audio id="audio" controls preload="none">
            Your browser does not support the audio element.
          </audio>
          <div class="links">
            <button id="open-archive-btn" disabled>Open on Archive.org</button>
            <button id="copy-url-btn" disabled>Copy audio URL</button>
          </div>
          <div id="tech-info" style="margin-top:6px; font-size:10px;">
            <span class="code" id="identifier-label"></span>
            <span class="code" id="format-label"></span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const statusEl = document.getElementById('status');
  const keywordEl = document.getElementById('keyword');
  const maxMinutesEl = document.getElementById('max-minutes');
  const licenseFilterEl = document.getElementById('license-filter');
  const startWindowEl = document.getElementById('start-window');
  const newSampleBtn = document.getElementById('new-sample-btn');
  const randomStartBtn = document.getElementById('randomize-start-btn');
  const audioEl = document.getElementById('audio');
  const openArchiveBtn = document.getElementById('open-archive-btn');
  const copyUrlBtn = document.getElementById('copy-url-btn');

  const titleEl = document.getElementById('sample-title');
  const creatorEl = document.getElementById('sample-creator');
  const yearEl = document.getElementById('sample-year');
  const tagsEl = document.getElementById('sample-tags');
  const descEl = document.getElementById('sample-desc');
  const idLabelEl = document.getElementById('identifier-label');
  const formatLabelEl = document.getElementById('format-label');

  let currentItem = null;
  let currentAudioFile = null;

  function setStatus(msg) {
    statusEl.textContent = msg;
  }

  function buildSearchQuery() {
    let q = 'mediatype:(audio) AND -subject:podcast AND -title:podcast';
    const keyword = keywordEl.value.trim();
    if (keyword) {
      // wrap keyword to avoid breaking query syntax
      q += ' AND (' + JSON.stringify(keyword).slice(1, -1) + ')';
    }
    if (licenseFilterEl.value === 'cc') {
      // heuristic: favour creative commons / open licenses
      q += ' AND (licenseurl:(creativecommons OR cc) OR rights:(creativecommons OR "public domain" OR "CC BY" OR "CC0"))';
    }
    return q;
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) {
      throw new Error('HTTP ' + res.status);
    }
    return res.json();
  }

  function pickRandomPage(numFound, rows) {
    if (!numFound || numFound <= rows) return 1;
    const maxPage = Math.min(Math.ceil(numFound / rows), 1000);
    return 1 + Math.floor(Math.random() * maxPage);
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function parseRuntimeToSeconds(runtime) {
    if (!runtime) return null;
    if (Array.isArray(runtime)) runtime = runtime[0];
    if (typeof runtime !== 'string') return null;
    const parts = runtime.split(':').map(p => parseInt(p, 10));
    if (parts.some(isNaN)) return null;
    let sec = 0;
    if (parts.length === 3) {
      sec = parts[0] * 3600 + parts[1] * 60 + parts[2];
    } else if (parts.length === 2) {
      sec = parts[0] * 60 + parts[1];
    } else if (parts.length === 1) {
      sec = parts[0];
    }
    return sec;
  }

  function passesRuntimeFilter(doc) {
    const maxMinutes = parseFloat(maxMinutesEl.value);
    if (!maxMinutes || maxMinutes <= 0) return true;
    const maxSeconds = maxMinutes * 60;
    const rtSec = parseRuntimeToSeconds(doc.runtime);
    if (rtSec == null) return true; // keep unknowns
    return rtSec <= maxSeconds;
  }

  async function findPlayableFile(identifier) {
    const metaUrl = 'https://archive.org/metadata/' + encodeURIComponent(identifier);
    const meta = await fetchJson(metaUrl);
    if (!meta || !meta.files) return null;
    const files = meta.files;

    const audioCandidates = files.filter(f => {
      const fmt = (f.format || '').toLowerCase();
      const name = (f.name || '').toLowerCase();
      if (!fmt && !name) return false;
      const isAudioFormat =
        fmt.includes('mp3') ||
        fmt.includes('ogg') ||
        fmt.includes('wave') ||
        fmt.includes('flac') ||
        fmt.includes('audio') ||
        name.endsWith('.mp3') ||
        name.endsWith('.ogg') ||
        name.endsWith('.wav') ||
        name.endsWith('.flac');
      // skip huge full-episode-style podcasts by guessing from file name
      const looksLikePodcast =
        name.includes('podcast') ||
        name.includes('episode') ||
        name.includes('ep_') ||
        name.includes('show-');
      return isAudioFormat && !looksLikePodcast;
    });

    if (!audioCandidates.length) return null;
    // prefer compressed formats
    audioCandidates.sort((a, b) => {
      const af = (a.format || '').toLowerCase();
      const bf = (b.format || '').toLowerCase();
      const score = fmt => {
        if (fmt.includes('vbr mp3')) return 0;
        if (fmt.includes('mp3')) return 1;
        if (fmt.includes('ogg')) return 2;
        if (fmt.includes('flac')) return 3;
        if (fmt.includes('wave') || fmt.includes('wav')) return 4;
        return 5;
      };
      return score(af) - score(bf);
    });

    const file = audioCandidates[0];
    const url = 'https://archive.org/download/' +
      encodeURIComponent(identifier) + '/' +
      encodeURIComponent(file.name);
    return { file, url };
  }

  function updateUIForItem(doc, identifier, fileObj, url) {
    currentItem = doc;
    currentAudioFile = fileObj;

    const title = doc.title || identifier;
    const creator = Array.isArray(doc.creator) ? doc.creator.join(', ') : doc.creator || '';
    const year = (Array.isArray(doc.year) ? doc.year[0] : doc.year) || '';
    const desc = Array.isArray(doc.description) ? doc.description[0] : doc.description || '';
    const collections = doc.collection ? (Array.isArray(doc.collection) ? doc.collection : [doc.collection]) : [];

    titleEl.textContent = title;
    creatorEl.textContent = creator ? 'By ' + creator : '';
    yearEl.textContent = year ? 'Year: ' + year : '';
    descEl.textContent = desc ? String(desc).slice(0, 800) : 'No description.';

    tagsEl.textContent = collections.length ? 'Collections: ' + collections.join(', ') : '';

    idLabelEl.textContent = identifier;
    formatLabelEl.textContent = (fileObj.format || '').toUpperCase() || (fileObj.name || '');

    audioEl.src = url;
    audioEl.load();

    const detailsUrl = 'https://archive.org/details/' + encodeURIComponent(identifier);
    openArchiveBtn.disabled = false;
    openArchiveBtn.onclick = () => {
      window.open(detailsUrl, '_blank', 'noopener');
    };

    copyUrlBtn.disabled = false;
    copyUrlBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(url);
        setStatus('Copied audio URL to clipboard.');
      } catch (e) {
        setStatus('Audio URL: ' + url);
      }
    };
  }

  async function loadRandomSample() {
    newSampleBtn.disabled = true;
    copyUrlBtn.disabled = true;
    openArchiveBtn.disabled = true;
    setStatus('Searching Internet Archive for audio...');

    const q = buildSearchQuery();
    const rows = 50;
    try {
      const baseUrl = 'https://archive.org/advancedsearch.php';
      const firstUrl =
        baseUrl +
        '?q=' + encodeURIComponent(q) +
        '&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=description&fl[]=year&fl[]=runtime&fl[]=collection&fl[]=licenseurl&fl[]=rights' +
        '&rows=' + rows +
        '&page=1&output=json';

      const initial = await fetchJson(firstUrl);
      const numFound = initial && initial.response && initial.response.numFound || 0;
      if (!numFound) {
        setStatus('No results. Try changing your filters or keyword.');
        newSampleBtn.disabled = false;
        return;
      }

      const page = pickRandomPage(numFound, rows);
      const pageUrl =
        baseUrl +
        '?q=' + encodeURIComponent(q) +
        '&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=description&fl[]=year&fl[]=runtime&fl[]=collection&fl[]=licenseurl&fl[]=rights' +
        '&rows=' + rows +
        '&page=' + page +
        '&output=json';

      const data = page === 1 ? initial : await fetchJson(pageUrl);
      let docs = (data && data.response && data.response.docs) || [];
      if (!docs.length) {
        setStatus('No docs on that page. Try again...');
        newSampleBtn.disabled = false;
        return;
      }

      // runtime filter
      docs = docs.filter(passesRuntimeFilter);
      if (!docs.length) {
        setStatus('Everything on that page is longer than your max runtime. Try raising it.');
        newSampleBtn.disabled = false;
        return;
      }

      shuffleArray(docs);

      for (const doc of docs) {
        const identifier = doc.identifier;
        if (!identifier) continue;
        setStatus('Checking "' + (doc.title || identifier) + '" for a playable file...');
        try {
          const playable = await findPlayableFile(identifier);
          if (!playable) continue;

          updateUIForItem(doc, identifier, playable.file, playable.url);
          setStatus('Loaded: ' + (doc.title || identifier));
          newSampleBtn.disabled = false;
          return;
        } catch (e) {
          console.error(e);
          continue;
        }
      }

      setStatus('Could not find a working preview on this batch. Try again.');
      newSampleBtn.disabled = false;

    } catch (err) {
      console.error(err);
      setStatus('Error talking to archive.org. Check your connection or CORS.');
      newSampleBtn.disabled = false;
    }
  }

  function randomizeStart() {
    if (!audioEl.src) {
      setStatus('No audio loaded yet.');
      return;
    }
    const win = parseFloat(startWindowEl.value);
    if (!isFinite(win) || win <= 0) {
      setStatus('Set a random start window > 0 seconds.');
      return;
    }

    const applyRandomStart = () => {
      const duration = audioEl.duration;
      if (!isFinite(duration) || duration <= 0) {
        setStatus('No duration info yet; press play once then retry.');
        return;
      }
      const maxJump = Math.min(win, duration);
      const t = Math.random() * maxJump;
      audioEl.currentTime = t;
      audioEl.play().catch(() => {});
      setStatus('Jumped to ' + t.toFixed(1) + 's.');
    };

    if (isNaN(audioEl.duration) || !isFinite(audioEl.duration)) {
      const onLoaded = () => {
        audioEl.removeEventListener('loadedmetadata', onLoaded);
        applyRandomStart();
      };
      audioEl.addEventListener('loadedmetadata', onLoaded);
      audioEl.load();
    } else {
      applyRandomStart();
    }
  }

  newSampleBtn.addEventListener('click', loadRandomSample);
  randomStartBtn.addEventListener('click', randomizeStart);

  // keyboard shortcut: space = randomize start, enter = new sample
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ') {
      e.preventDefault();
      randomizeStart();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      loadRandomSample();
    }
  });

  setStatus('Ready. Press "New random sample" to pull from Internet Archive.');
})();
</script>
</body>
</html>
