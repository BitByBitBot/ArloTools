<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArloTools</title>
  <style>
    @font-face {
      font-family: 'FaceOff';
      src: url('Face off!.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: inherit;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: clamp(32px, 6vw, 72px) clamp(16px, 6vw, 96px) clamp(24px, 4vw, 48px);
      max-width: 960px;
      margin: 0 auto;
    }

    .logo {
      width: clamp(160px, 28vw, 240px);
      height: auto;
      display: block;
      margin: 0 auto clamp(18px, 3vw, 32px);
    }

    h1 {
      font-family: 'FaceOff', 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0;
    }

    .tagline {
      margin: clamp(16px, 2vw, 24px) auto clamp(24px, 4vw, 48px);
      max-width: 620px;
      font-size: clamp(1rem, 2.3vw, 1.3rem);
      line-height: 1.6;
      letter-spacing: 0.01em;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .category-button {
      border: 1px solid #111;
      background: #fff;
      color: #111;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 18px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      border-radius: 0;
    }

    .category-button:focus-visible {
      outline: 2px solid #111;
      outline-offset: 2px;
    }

    .category-button:hover,
    .category-button:focus-visible {
      transform: translateY(-2px);
      background: #111;
      color: #fff;
    }

    .category-button.active {
      background: #111;
      color: #fff;
    }

    .floating-tools {
      position: absolute;
      inset: 0;
    }

    .cluster-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      z-index: 1;
    }

    .cluster-label {
      position: absolute;
      padding: 6px 14px;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 30px rgba(17, 17, 17, 0.18);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .tool-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(150px, 18vw, 190px);
      height: clamp(110px, 15vw, 150px);
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
      border: 1px solid #111;
      background:
        linear-gradient(130deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.85)),
        linear-gradient(155deg, rgba(255, 214, 248, 0.22), rgba(209, 239, 255, 0.22) 50%, rgba(255, 247, 214, 0.28));
      box-shadow: 0 16px 44px rgba(17, 17, 17, 0.12);
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
      border-radius: 0;
      letter-spacing: 0.04em;
      font-weight: 600;
      font-size: clamp(0.92rem, 1.6vw, 1.05rem);
      transition: box-shadow 0.2s ease;
      pointer-events: auto;
    }

    .tool-card:hover,
    .tool-card:focus-visible {
      box-shadow: 0 20px 60px rgba(17, 17, 17, 0.18);
      outline: none;
    }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: clamp(24px, 6vw, 48px) clamp(16px, 6vw, 96px) clamp(48px, 8vw, 72px);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #333;
    }

    @media (max-width: 640px) {
      .category-button {
        width: 100%;
        max-width: 220px;
      }

      .tool-card {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="false">
    <div class="floating-tools" id="floatingTools" aria-label="Floating tool gallery"></div>
    <div class="cluster-labels" id="clusterLabels" aria-hidden="true"></div>
  </div>

  <header>
    <img src="ArloTools nucourier.svg" alt="ArloTools logo" class="logo" loading="lazy">
    <h1>ArloTools</h1>
    <p class="tagline">
      A rotating collection of Arlo Robbins experiments. Let the tools drift, or gather them by medium and experience to find the
      right spark.
    </p>
    <div class="category-buttons" role="group" aria-label="Tool sorting">
      <button class="category-button active" data-mode="orbit">All Tools</button>
      <button class="category-button" data-mode="medium">Sort by Medium</button>
      <button class="category-button" data-mode="experience">Sort by Experience</button>
    </div>
  </header>

  <footer>
    © 2025 Arlo Robbins — Built to share curiosity.
  </footer>

  <script>
    const toolData = [
      {
        name: 'Archive Roulette',
        link: 'toolspage.html?tool=tools/archive_shuffle.html',
        medium: 'video',
        experience: 'in-depth'
      },
      {
        name: 'Boid Simulator',
        link: 'toolspage.html?tool=tools/boids.html',
        medium: 'visual',
        experience: 'mesmerizing'
      },
      {
        name: 'Border Tool',
        link: 'toolspage.html?tool=tools/medieval_border_generator.html',
        medium: 'visual',
        experience: 'practical'
      },
      {
        name: 'Chisel Tool',
        link: 'toolspage.html?tool=tools/chisel_pen.html',
        medium: 'visual',
        experience: 'practical'
      },
      {
        name: 'Colorspace Visualizer',
        link: 'toolspage.html?tool=tools/3_d_color_space.html',
        medium: 'visual',
        experience: 'mesmerizing'
      },
      {
        name: 'Fractal Explorer',
        link: 'toolspage.html?tool=tools/Fractal_Lab.html',
        medium: 'visual',
        experience: 'in-depth'
      },
      {
        name: 'Heart Generator',
        link: 'toolspage.html?tool=tools/I_<3_WIKI.html',
        medium: 'visual',
        experience: 'playful'
      },
      {
        name: 'Game of Life Variations',
        link: 'toolspage.html?tool=tools/graded_game_of_life.html',
        medium: 'visual',
        experience: 'in-depth'
      },
      {
        name: 'Lissajous Visualizer',
        link: 'toolspage.html?tool=tools/lissajous_figure_grid.html',
        medium: 'visual',
        experience: 'mesmerizing'
      },
      {
        name: 'Modern Grid Generator',
        link: 'toolspage.html?tool=tools/auto_modern_grid_layout.html',
        medium: 'visual',
        experience: 'practical'
      },
      {
        name: 'Neumes Converter',
        link: 'toolspage.html?tool=tools/midi_→_neumes_converter.html',
        medium: 'audio',
        experience: 'in-depth'
      },
      {
        name: 'Node Tool',
        link: 'toolspage.html?tool=tools/Node_Net.html',
        medium: 'visual',
        experience: 'in-depth'
      },
      {
        name: 'Skewer Tool',
        link: 'toolspage.html?tool=tools/GlitchSkewer.html',
        medium: 'video',
        experience: 'mesmerizing'
      },
      {
        name: 'Spectrogram Collage',
        link: 'toolspage.html?tool=tools/Spectrogram_Collage.html',
        medium: 'audio',
        experience: 'mesmerizing'
      },
      {
        name: 'Spectrogram JPEG Tool',
        link: 'toolspage.html?tool=tools/SpectroJPEG.html',
        medium: 'audio',
        experience: 'in-depth'
      },
      {
        name: 'Tiler Tool',
        link: 'toolspage.html?tool=tools/square_tiler.html',
        medium: 'visual',
        experience: 'practical'
      },
      {
        name: 'Tree Generator',
        link: 'toolspage.html?tool=tools/tree_generator.html',
        medium: 'visual',
        experience: 'mesmerizing'
      }
    ];

    const floatingTools = document.getElementById('floatingTools');
    const clusterLabels = document.getElementById('clusterLabels');
    const buttons = document.querySelectorAll('.category-button');

    const entries = [];
    const BASE_FLOAT_MIN = 18;
    const BASE_FLOAT_MAX = 34;
    const GROUP_SCALE = 0.78;
    const ORBIT_SCALE = 1;

    toolData.forEach((tool) => {
      const el = document.createElement('a');
      el.className = 'tool-card';
      el.href = tool.link;
      el.textContent = tool.name;
      el.setAttribute('data-medium', tool.medium);
      el.setAttribute('data-experience', tool.experience);
      el.setAttribute('title', `${tool.name} — ${tool.medium} · ${tool.experience}`);
      floatingTools.appendChild(el);

      entries.push({
        data: tool,
        element: el,
        angle: Math.random() * Math.PI * 2,
        speed: 0.00012 + Math.random() * 0.00009,
        baseFloatRadius: BASE_FLOAT_MIN + Math.random() * (BASE_FLOAT_MAX - BASE_FLOAT_MIN),
        targetFloatRadius: 0,
        currentFloatRadius: 0,
        targetX: window.innerWidth / 2,
        targetY: window.innerHeight / 2,
        displayX: window.innerWidth / 2,
        displayY: window.innerHeight / 2,
        targetScale: ORBIT_SCALE,
        scale: ORBIT_SCALE,
        width: 0,
        height: 0
      });
    });

    function measureCards() {
      entries.forEach((entry) => {
        const rect = entry.element.getBoundingClientRect();
        entry.width = rect.width;
        entry.height = rect.height;
      });
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function layoutOrbit() {
      clusterLabels.innerHTML = '';

      const width = window.innerWidth;
      const height = window.innerHeight;
      const marginX = Math.max(60, width * 0.08);
      const marginY = Math.max(80, height * 0.12);
      const innerWidth = Math.max(200, width - marginX * 2);
      const innerHeight = Math.max(200, height - marginY * 2);

      const sampleWidth = entries[0]?.width || 160;
      const sampleHeight = entries[0]?.height || 120;
      const minSpacingX = sampleWidth + 50;
      const minSpacingY = sampleHeight + 50;

      let columns = Math.max(1, Math.floor(innerWidth / minSpacingX));
      columns = Math.min(columns, entries.length);
      let rows = Math.ceil(entries.length / columns);

      while (columns > 1 && rows * minSpacingY > innerHeight) {
        columns -= 1;
        rows = Math.ceil(entries.length / columns);
      }

      const actualSpacingX = innerWidth / columns;
      const actualSpacingY = innerHeight / rows;

      entries.forEach((entry, index) => {
        const col = index % columns;
        const row = Math.floor(index / columns);
        const baseX = marginX + (col + 0.5) * actualSpacingX;
        const baseY = marginY + (row + 0.5) * actualSpacingY;
        const safeX = clamp(baseX, entry.width / 2 + 40, width - entry.width / 2 - 40);
        const safeY = clamp(baseY, entry.height / 2 + 40, height - entry.height / 2 - 40);

        entry.targetX = safeX;
        entry.targetY = safeY;
        entry.targetScale = ORBIT_SCALE;
        entry.targetFloatRadius = entry.baseFloatRadius;
      });
    }

    function layoutGrouped(key) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const marginX = Math.max(60, width * 0.08);
      const marginY = Math.max(120, height * 0.15);
      const innerWidth = Math.max(200, width - marginX * 2);
      const innerHeight = Math.max(240, height - marginY * 2);

      const groups = new Map();
      entries.forEach((entry) => {
        const bucket = entry.data[key];
        if (!groups.has(bucket)) {
          groups.set(bucket, []);
        }
        groups.get(bucket).push(entry);
      });

      const buckets = Array.from(groups.keys());
      const ratio = width / Math.max(height, 1);
      const columns = Math.max(1, Math.min(buckets.length, Math.round(Math.sqrt(buckets.length * ratio))));
      const rows = Math.max(1, Math.ceil(buckets.length / columns));
      const cellWidth = innerWidth / columns;
      const cellHeight = innerHeight / rows;

      clusterLabels.innerHTML = '';

      buckets.forEach((bucket, index) => {
        const col = index % columns;
        const row = Math.floor(index / columns);
        const originX = marginX + col * cellWidth + cellWidth / 2;
        const originY = marginY + row * cellHeight + cellHeight / 2;

        const label = document.createElement('div');
        label.className = 'cluster-label';
        label.textContent = bucket;
        label.style.left = `${originX}px`;
        label.style.top = `${originY - cellHeight * 0.38}px`;
        clusterLabels.appendChild(label);

        const members = groups.get(bucket);
        const areaWidth = cellWidth * 0.82;
        const areaHeight = cellHeight * 0.65;

        const cardWidth = (entries[0]?.width || 160) * GROUP_SCALE;
        const perRow = Math.max(1, Math.floor(areaWidth / (cardWidth + 24)));
        const rowsNeeded = Math.max(1, Math.ceil(members.length / perRow));
        const spacingX = areaWidth / perRow;
        const spacingY = areaHeight / rowsNeeded;

        members.forEach((entry, memberIndex) => {
          const r = Math.floor(memberIndex / perRow);
          const c = memberIndex % perRow;
          const x = originX - areaWidth / 2 + spacingX * (c + 0.5);
          const y = originY - areaHeight / 2 + spacingY * (r + 0.5) + 24;

          entry.targetX = clamp(x, entry.width * GROUP_SCALE / 2 + 32, width - entry.width * GROUP_SCALE / 2 - 32);
          entry.targetY = clamp(y, entry.height * GROUP_SCALE / 2 + 32, height - entry.height * GROUP_SCALE / 2 - 32);
          entry.targetScale = GROUP_SCALE;
          entry.targetFloatRadius = Math.min(12, entry.baseFloatRadius);
        });
      });
    }

    let mode = 'orbit';
    let lastTime = performance.now();

    function animate(time) {
      const delta = time - lastTime;
      lastTime = time;

      entries.forEach((entry) => {
        entry.angle += entry.speed * delta;
        entry.currentFloatRadius += (entry.targetFloatRadius - entry.currentFloatRadius) * 0.08;
        entry.scale += (entry.targetScale - entry.scale) * 0.12;
        entry.displayX += (entry.targetX - entry.displayX) * 0.1;
        entry.displayY += (entry.targetY - entry.displayY) * 0.1;

        const offsetX = Math.cos(entry.angle) * entry.currentFloatRadius;
        const offsetY = Math.sin(entry.angle) * entry.currentFloatRadius;
        const finalX = entry.displayX + offsetX;
        const finalY = entry.displayY + offsetY;

        entry.element.style.left = `${finalX}px`;
        entry.element.style.top = `${finalY}px`;
        entry.element.style.transform = `translate(-50%, -50%) scale(${entry.scale})`;
      });

      requestAnimationFrame(animate);
    }

    function setMode(nextMode) {
      if (mode === nextMode) return;
      mode = nextMode;

      if (mode === 'orbit') {
        layoutOrbit();
      } else {
        layoutGrouped(mode);
      }
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        buttons.forEach((btn) => btn.classList.remove('active'));
        button.classList.add('active');
        const modeSelected = button.dataset.mode;
        if (modeSelected === 'orbit') {
          setMode('orbit');
        } else {
          setMode(modeSelected);
        }
      });
    });

    function handleResize() {
      measureCards();
      if (mode === 'orbit') {
        layoutOrbit();
      } else {
        layoutGrouped(mode);
      }
    }

    window.addEventListener('resize', () => {
      handleResize();
    });

    measureCards();
    layoutOrbit();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
