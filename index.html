<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArloTools</title>
  <style>
    @font-face {
      font-family: 'FaceOff';
      src: url('Face off!.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #050505;
      font-family: inherit;
      overflow: hidden;
    }

    .site-shell {
      position: relative;
      z-index: 1;
      padding: clamp(28px, 5vw, 48px) clamp(32px, 6vw, 72px) clamp(32px, 6vw, 64px);
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: clamp(24px, 4vw, 48px);
      position: relative;
      z-index: 3;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2vw, 18px);
      max-width: min(520px, 70vw);
    }

    .brand-logo {
      width: clamp(220px, 32vw, 360px);
      height: auto;
    }

    .descriptor {
      margin: 0;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      font-size: clamp(0.65rem, 1.3vw, 0.8rem);
      line-height: 1.6;
    }

    .site-nav {
      display: flex;
      gap: clamp(18px, 3vw, 32px);
      align-items: flex-start;
      padding-top: clamp(12px, 2vw, 20px);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: clamp(0.7rem, 1.4vw, 0.85rem);
    }

    .site-nav a {
      text-decoration: none;
      color: inherit;
      position: relative;
      padding-bottom: 4px;
    }

    .site-nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease;
    }

    .site-nav a:hover::after,
    .site-nav a:focus-visible::after {
      transform: scaleX(1);
    }

    .site-nav a:focus-visible {
      outline: none;
    }

    .site-nav a[data-active="true"] {
      color: #d40000;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      perspective: 1400px;
      perspective-origin: 50% 50%;
    }

    .glow-layer,
    .label-layer,
    .tool-layer {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: multiply;
      filter: blur(0.5px);
      opacity: 0.95;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .label-layer {
      pointer-events: none;
      font-size: clamp(1.8rem, 7vw, 4.4rem);
      letter-spacing: 0.08em;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.9);
    }

    .cluster-label {
      position: absolute;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .tool-layer {
      position: absolute;
      inset: 0;
    }

    .tool-card {
      /* Base card styles: cards orbit around the scene.  They are wider than
         tall, semi‑transparent, and have no drop shadows. */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(200px, 18vw, 240px);
      height: clamp(150px, 14vw, 180px);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #050505;
      /* Remove any box‑shadow so cards have clean edges. */
      box-shadow: none;
      display: flex;
      flex-direction: column;
      text-align: left;
      font-weight: 600;
      color: #050505;
      text-decoration: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.3;
      transition: border-color 0.2s ease, opacity 0.2s ease;
      will-change: transform;
      overflow: hidden;
      transform-style: preserve-3d;
      backface-visibility: visible;
      pointer-events: auto;
    }

    /* When a card is hovered, subtly change the border colour to draw focus. */
    .tool-card.is-hovered {
      border-color: #d40000;
    }

    .tool-card:focus-visible {
      outline: 2px solid #d40000;
      outline-offset: 4px;
    }

    /* Remove hover shadow entirely – focus is handled in JS */
    .tool-card:hover {
      border-color: #d40000;
    }

    .tool-media {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      border-bottom: 2px solid #050505;
      background: #050505;
      overflow: hidden;
    }

    .tool-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .tool-title {
      padding: clamp(12px, 2vw, 18px) clamp(14px, 2.1vw, 20px);
      letter-spacing: 0.08em;
      font-size: clamp(0.64rem, 1.28vw, 0.82rem);
    }

    .sort-bar {
      position: fixed;
      left: clamp(24px, 5vw, 72px);
      bottom: clamp(24px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: clamp(12px, 2vw, 28px);
      z-index: 3;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: clamp(0.62rem, 1.3vw, 0.78rem);
    }

    .sort-bar span {
      font-weight: 600;
    }

    .sort-button {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      cursor: pointer;
      color: inherit;
      position: relative;
    }

    .sort-button::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 2px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease;
    }

    .sort-button:focus-visible {
      outline: none;
      color: #d40000;
    }

    .sort-button:hover::after,
    .sort-button:focus-visible::after {
      transform: scaleX(1);
    }

    .sort-button[data-active="true"] {
      color: #d40000;
    }

    .sort-button[data-active="true"]::after {
      transform: scaleX(1);
    }

    /* Mobile-specific home layout */
    .mobile-home {
      display: none;
      padding: 0 24px 48px;
      gap: 20px;
    }

    .mobile-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mobile-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .mobile-section h3 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .mobile-tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      width: 100%;
    }

    .mobile-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid #050505;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      background: #fff;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .mobile-card:hover,
    .mobile-card:focus-visible {
      border-color: #d40000;
      outline: none;
      transform: translateY(-2px);
    }

    .mobile-card__media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 10px;
      background: #050505;
    }

    .mobile-card__media video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mobile-card__title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .mobile-card__meta {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #3a3a3a;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
    }

    .mobile-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #050505;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
    }

    .secret-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 22px;
      flex-direction: column;
      padding: clamp(24px, 6vw, 48px);
      background: radial-gradient(circle at 30% 30%, #fff7d9 0%, #ffe9e9 36%, #f6f6ff 72%, #ffffff 100%);
      color: #050505;
      z-index: 1000;
      text-align: center;
      cursor: pointer;
    }

    .secret-overlay.is-active {
      display: flex;
    }

    .secret-title {
      margin: 0;
      letter-spacing: 0.2em;
      font-size: clamp(0.85rem, 1.6vw, 1rem);
      text-transform: uppercase;
    }

    .secret-message {
      font-family: inherit;
      font-size: clamp(2.6rem, 8vw, 5rem);
      letter-spacing: 0.08em;
      max-width: 900px;
      line-height: 1.1;
      margin: 0;
    }

    .secret-hint {
      margin: 0;
      font-size: clamp(0.78rem, 1.4vw, 0.95rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .site-shell {
        padding: 24px;
      }

      .site-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .site-nav {
        order: 3;
      }

      .sort-bar {
        position: sticky;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 24px;
        background: #fff;
        border-bottom: 1px solid #050505;
        margin: 12px 0 16px;
        z-index: 5;
      }

      .stage {
        display: none;
      }

      .mobile-home {
        display: flex;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="false">
    <div class="glow-layer" id="glowLayer"></div>
    <div class="label-layer" id="labelLayer" aria-hidden="true"></div>
    <div class="tool-layer" id="toolLayer" aria-live="polite"></div>
  </div>

  <div class="site-shell">
    <header class="site-header">
      <div class="brand">
        <a href="index.html" aria-label="ArloTools home">
          <img src="ArloTools nucourier.svg" alt="ArloTools" class="brand-logo" loading="lazy">
        </a>
        <p class="descriptor">A CATALOG OF EXPERIMENTAL ART TOOLS BY ARLO ROBBINS</p>
      </div>
      <nav class="site-nav" aria-label="Site">
        <a href="about.html">About</a>
        <a href="toolspage.html">Full List</a>
      </nav>
    </header>
  </div>

  <div class="sort-bar" role="group" aria-label="Sort tools">
    <span>SORT BY:</span>
    <button class="sort-button" type="button" data-mode="medium">Medium</button>
    <button class="sort-button" type="button" data-mode="experience">Experience</button>
  </div>

  <main class="mobile-home" id="mobileHome" aria-label="ArloTools mobile catalog">
    <div class="mobile-grid" id="mobileGrid" aria-live="polite"></div>
  </main>

  <div class="secret-overlay" id="secretOverlay" aria-hidden="true" role="dialog" aria-label="Secret Tool">
    <p class="secret-title">Secret Tool</p>
    <p class="secret-message" id="secretMessage">Hidden Phrase</p>
    <p class="secret-hint">Click anywhere to change · Press Esc to close</p>
  </div>

  <script>
    const toolData = [
      {

      },

      },
      {

        medium: 'VISUAL',

      },

      },

      },
      {

        video: 'videos/fractal demo.mp4'
      },
      {

        experience: 'PLAYFUL',

      },
      {

        link: 'toolspage.html?tool=tools/graded_game_of_life.html',
        medium: 'VISUAL',
        experience: 'TECHNICAL',
        video: 'videos/life demo.mp4'
      },
      {
        name: 'Lissajous Visualizer',
        link: 'toolspage.html?tool=tools/lissajous_figure_grid.html',
        medium: 'VISUAL',
        experience: 'PLAYFUL',
        video: 'videos/lissajous demo.mp4'
      },
      {
        name: 'Modern Grid Generator',
        link: 'toolspage.html?tool=tools/auto_modern_grid_layout.html',
        medium: 'VISUAL',
        experience: 'TECHNICAL',
        video: 'videos/modern grid demo.mp4'
      },
      {
        name: 'Neumes Converter',
        link: 'toolspage.html?tool=tools/midi_→_neumes_converter.html',
        medium: 'AUDIO',
        experience: 'TECHNICAL',
        video: 'videos/neumes demo.mp4'
      },
      {
        name: 'Node Tool',
        link: 'toolspage.html?tool=tools/Node_Net.html',
        medium: 'VISUAL',
        experience: 'TECHNICAL',
        video: 'videos/node demo.mp4'
      },
      {
        name: 'Skewer Tool',
        link: 'toolspage.html?tool=tools/GlitchSkewer.html',
        medium: 'VISUAL',
        experience: 'MESMERIZING',
        video: 'videos/skewer demo.mp4'
      },
      {
        name: 'Spectrogram Collage',
        link: 'toolspage.html?tool=tools/Spectrogram_Collage.html',
        medium: 'AUDIO',
        experience: 'TECHNICAL',
        video: 'videos/spectro collage demo.mp4'
      },
      {
        name: 'Spectrogram JPEG Tool',
        link: 'toolspage.html?tool=tools/SpectroJPEG.html',
        medium: 'AUDIO',
        experience: 'TECHNICAL',
        video: 'videos/spectro jpeg demo.mp4'
      },
      {
        name: 'Tiler Tool',
        link: 'toolspage.html?tool=tools/square_tiler.html',
        medium: 'VISUAL',
        experience: 'PLAYFUL',
        video: 'videos/tiler demo.mp4'
      },
      {
        name: 'Tree Generator',
        link: 'toolspage.html?tool=tools/tree_generator.html',
        medium: 'VISUAL',
        experience: 'PLAYFUL',
        video: 'videos/tree demo.mp4'
      }

    ];

    const toolLayer = document.getElementById('toolLayer');
    const labelLayer = document.getElementById('labelLayer');
    const glowLayer = document.getElementById('glowLayer');
    const buttons = document.querySelectorAll('.sort-button');
    const header = document.querySelector('.site-header');
    const mobileGrid = document.getElementById('mobileGrid');
    const mobileHome = document.getElementById('mobileHome');
    const mobileQuery = window.matchMedia('(max-width: 720px)');

    const entries = [];
    const BASE_FLOAT = { min: 14, max: 28 };
    // When grouping tools by medium or experience, shrink them so clusters fit
    // comfortably without overlapping.  A smaller value yields tighter clusters.
    const GROUP_SCALE = 0.55;

    const MODE_SETTINGS = {
      all: {
        glows: [
          { x: 0.35, y: 0.55, size: 520, color: 'rgba(255, 160, 184, 0.35)' },
          { x: 0.58, y: 0.35, size: 460, color: 'rgba(170, 207, 255, 0.35)' },
          { x: 0.52, y: 0.7, size: 520, color: 'rgba(220, 255, 170, 0.3)' },
          { x: 0.72, y: 0.52, size: 480, color: 'rgba(255, 214, 170, 0.32)' }
        ]
      },
      medium: {
        order: ['AUDIO', 'VISUAL', 'TEXT'],
        glows: {
          AUDIO: { x: 0.28, y: 0.58, size: 480, color: 'rgba(255, 154, 169, 0.38)' },
          VISUAL: { x: 0.7, y: 0.42, size: 500, color: 'rgba(171, 210, 255, 0.38)' },
          TEXT: { x: 0.7, y: 0.72, size: 460, color: 'rgba(215, 255, 186, 0.34)' }
        }
      },
      experience: {
        order: ['TECHNICAL', 'PLAYFUL', 'MESMERIZING'],
        glows: {
          TECHNICAL: { x: 0.32, y: 0.38, size: 520, color: 'rgba(255, 154, 169, 0.36)' },
          PLAYFUL: { x: 0.32, y: 0.7, size: 460, color: 'rgba(215, 255, 186, 0.32)' },
          MESMERIZING: { x: 0.72, y: 0.5, size: 520, color: 'rgba(171, 210, 255, 0.4)' }
        }
      }
    };

    function createToolCards() {
      toolData.forEach((tool) => {
        const el = document.createElement('a');
        el.className = 'tool-card';
        el.href = tool.link;
        el.setAttribute('data-medium', tool.medium);
        el.setAttribute('data-experience', tool.experience);
        el.setAttribute('title', `${tool.name} — ${tool.medium} · ${tool.experience}`);

        const media = document.createElement('div');
        media.className = 'tool-media';
        const video = document.createElement('video');
        video.muted = true;
        video.loop = true;
        video.autoplay = true;
        video.playsInline = true;
        if (tool.video) {
          video.src = tool.video;
        }
        video.setAttribute('aria-hidden', 'true');
        video.preload = 'auto';
        media.appendChild(video);

        const title = document.createElement('div');
        title.className = 'tool-title';
        title.textContent = tool.name;

        el.appendChild(media);
        el.appendChild(title);
        toolLayer.appendChild(el);

        // Each entry controls a single floating card.  We intentionally keep
        // movement parameters simple: cards orbit horizontally around the Y
        // axis, spinning only around their vertical axis.  Additional fields
        // needed for random inclination/tilt/roll have been removed to avoid
        // unwanted rotations and to keep the animation predictable.
        const initialDepth = 260 + Math.random() * 160;
        const orbitIndex = entries.length;
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const entry = {
          data: tool,
          element: el,
          width: 0,
          height: 0,
          // Angle around the Y axis for orbital motion
          angle: Math.random() * Math.PI * 2,
          // Orbital speed (radians per ms)
          speed: 0.00012 + Math.random() * 0.00008,
          // Baseline X and Y coordinates the orbit is centered on
          targetX: window.innerWidth / 2,
          targetY: window.innerHeight / 2,
          displayX: window.innerWidth / 2,
          displayY: window.innerHeight / 2,
          // Scaling and float animation values
          targetScale: 1,
          scale: 1,
          targetFloat: BASE_FLOAT.min,
          currentFloat: BASE_FLOAT.min,
          // Depth for perspective (unused for orbital placement)
          targetDepth: initialDepth,
          depth: initialDepth,
          // Interaction flags
          paused: false,
          hovered: false,
          // Each card is offset by a golden angle to distribute orbits evenly
          orbitPhase: orbitIndex * goldenAngle,
          // These will be computed in updateOrbitParams()
          orbitRadius: 100,
          orbitAltitude: 0,
          // Rotation values around axes
          rotationY: 0,
          // Spin state for rotation around Y
          spinAngle: Math.random() * Math.PI * 2,
          spinSpeed: 0.00016 + Math.random() * 0.00014,
          spinRange: 40 + Math.random() * 30,
          spinOffset: (Math.random() - 0.5) * 12
        };

        el.addEventListener('mouseenter', () => {
          entry.paused = true;
          entry.hovered = true;
          entry.element.classList.add('is-hovered');
        });

        el.addEventListener('mouseleave', () => {
          entry.paused = false;
          entry.hovered = false;
          entry.element.classList.remove('is-hovered');
        });

        entries.push(entry);
      });
    }

    function measureCards() {
      entries.forEach((entry) => {
        const rect = entry.element.getBoundingClientRect();
        entry.width = rect.width;
        entry.height = rect.height;
      });
    }

    // Assign radii and altitudes for each tool's orbit.  The radius spacing
    // scales with the viewport size to keep the cards visible and prevent
    // intersections.  Altitudes distribute the cards vertically to further
    // reduce overlap.  This function should be called after cards are
    // measured and whenever the viewport size changes.
    function updateOrbitParams() {
      const total = entries.length;
      if (total === 0) return;
      // Maximum radius is a fraction of the smaller viewport dimension so
      // orbits remain inside the screen.
      // Increase the maximum radius slightly so that cards orbit further from the
      // center, reducing overlap.  Cap at 40% of the smaller dimension.
      const maxRadius = Math.min(window.innerWidth, window.innerHeight) * 0.45;
      const radiusStep = maxRadius / (total + 1);
      // Spread cards vertically across roughly one‑third of the viewport height.
      // Cap the total range so cards don't leave the screen.
      const altRange = Math.min(window.innerHeight * 0.4, 450);
      const altStep = altRange / (total + 1);
      entries.forEach((entry, index) => {
        entry.orbitRadius = radiusStep * (index + 1);
        entry.orbitAltitude = -altRange / 2 + altStep * (index + 1);
      });
    }

    function getBounds(scale = 1) {
      const headerRect = header.getBoundingClientRect();
      const topPadding = headerRect.bottom + 40;
      const bottomPadding = 120;
      const sidePadding = 120;
      const width = window.innerWidth;
      const height = window.innerHeight;
      const sample = entries[0];
      const cardWidth = (sample?.width || 200) * scale;
      const cardHeight = (sample?.height || 140) * scale;

      return {
        minX: sidePadding + cardWidth / 2,
        maxX: Math.max(sidePadding + cardWidth / 2, width - sidePadding - cardWidth / 2),
        minY: topPadding + cardHeight / 2,
        maxY: Math.max(topPadding + cardHeight / 2, height - bottomPadding - cardHeight / 2)
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function renderGlows(defs) {
      glowLayer.innerHTML = '';
      defs.forEach((def) => {
        const el = document.createElement('div');
        el.className = 'glow';
        el.style.width = `${def.size}px`;
        el.style.height = `${def.size}px`;
        el.style.left = `${def.x * 100}%`;
        el.style.top = `${def.y * 100}%`;
        el.style.transform = 'translate(-50%, -50%)';
        el.style.background = `radial-gradient(circle at center, ${def.color} 0%, rgba(255, 255, 255, 0) 72%)`;
        glowLayer.appendChild(el);
      });
    }

    function layoutAll() {
      labelLayer.innerHTML = '';
      renderGlows(MODE_SETTINGS.all.glows);

      const bounds = getBounds();
      const placements = [];
      const attemptsPerCard = 260;
      const spacingFloor = Math.max((entries[0]?.width || 200) * 0.82, 140);

      entries.forEach((entry) => {
        let best = {
          x: (bounds.minX + bounds.maxX) / 2,
          y: (bounds.minY + bounds.maxY) / 2,
          distance: 0
        };

        for (let attempt = 0; attempt < attemptsPerCard; attempt += 1) {
          const x = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
          const y = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
          const distance = placements.reduce((min, pt) => {
            const dx = pt.x - x;
            const dy = pt.y - y;
            return Math.min(min, Math.hypot(dx, dy));
          }, Number.POSITIVE_INFINITY);

          if (distance > best.distance) {
            best = { x, y, distance };
          }

          if (distance >= spacingFloor) {
            best = { x, y, distance };
            break;
          }
        }

        placements.push({ x: best.x, y: best.y });
        entry.targetX = best.x;
        entry.targetY = best.y;
        entry.targetScale = 1;
        entry.targetFloat = BASE_FLOAT.min + Math.random() * (BASE_FLOAT.max - BASE_FLOAT.min);
        entry.targetDepth = 280 + Math.random() * 180;
      });
    }

    function renderLabels(mode) {
      labelLayer.innerHTML = '';
      const settings = MODE_SETTINGS[mode];
      settings.order.forEach((name) => {
        const label = document.createElement('div');
        label.className = 'cluster-label';
        label.textContent = name;
        const cluster = settings.glows[name];
        const bounds = getBounds(GROUP_SCALE);
        const x = clamp(cluster.x * window.innerWidth, bounds.minX, bounds.maxX);
        const y = clamp(cluster.y * window.innerHeight, bounds.minY, bounds.maxY);
        label.style.left = `${x}px`;
        label.style.top = `${y - 120}px`;
        labelLayer.appendChild(label);
      });
    }

    function layoutGrouped(mode) {
      const settings = MODE_SETTINGS[mode];
      const groups = new Map();
      entries.forEach((entry) => {
        const key = mode === 'medium' ? entry.data.medium : entry.data.experience;
        if (!groups.has(key)) {
          groups.set(key, []);
        }
        groups.get(key).push(entry);
      });

      const glows = settings.order.map((key) => settings.glows[key]);
      renderGlows(glows);
      renderLabels(mode);

      const bounds = getBounds(GROUP_SCALE);
      const spacingX = (entries[0]?.width || 200) * GROUP_SCALE * 1.15;
      const spacingY = (entries[0]?.height || 140) * GROUP_SCALE * 1.2;

      settings.order.forEach((key) => {
        const members = groups.get(key) || [];
        const cluster = settings.glows[key];
        const centerX = clamp(cluster.x * window.innerWidth, bounds.minX, bounds.maxX);
        const centerY = clamp(cluster.y * window.innerHeight, bounds.minY, bounds.maxY);
        const columns = Math.max(1, Math.ceil(Math.sqrt(members.length)));
        const rows = Math.max(1, Math.ceil(members.length / columns));

        members.forEach((entry, index) => {
          const row = Math.floor(index / columns);
          const col = index % columns;
          const offsetX = (col - (columns - 1) / 2) * spacingX + (Math.random() - 0.5) * 24;
          const offsetY = (row - (rows - 1) / 2) * spacingY + (Math.random() - 0.5) * 24;
          const targetX = clamp(centerX + offsetX, bounds.minX, bounds.maxX);
          const targetY = clamp(centerY + offsetY, bounds.minY, bounds.maxY);

          entry.targetX = targetX;
          entry.targetY = targetY;
          entry.targetScale = GROUP_SCALE;
          entry.targetFloat = 6 + Math.random() * 6;
          entry.targetDepth = 140 + Math.random() * 80;
        });
      });
    }

    let mode = 'all';
    let lastTime = performance.now();
    const TAU = Math.PI * 2;

    function animate(time) {
      const delta = time - lastTime;
      lastTime = time;
      const positions = [];

      // First update each entry's internal state and compute its tentative
      // position, scale and rotation.  These positions will later be
      // adjusted to avoid overlapping cards.
      entries.forEach((entry) => {
        // Advance orbital angle if not paused (hovering pauses motion).
        if (!entry.paused) {
          entry.angle = (entry.angle + entry.speed * delta) % TAU;
        }

        // Advance the spin (rotation about Y) only when not hovered.  When
        // hovered, cards smoothly rotate to face the viewer.
        if (!entry.hovered) {
          entry.spinAngle = (entry.spinAngle + entry.spinSpeed * delta) % TAU;
        }

        // Interpolate towards target values for floating, depth, scale and
        // baseline positions (these targets are set by layoutAll/grouped).
        entry.currentFloat += (entry.targetFloat - entry.currentFloat) * 0.12;
        entry.depth += (entry.targetDepth - entry.depth) * 0.12;
        entry.scale += (entry.targetScale - entry.scale) * 0.14;
        entry.displayX += (entry.targetX - entry.displayX) * 0.12;
        entry.displayY += (entry.targetY - entry.displayY) * 0.12;

        // Calculate orbital offsets.  Each card has a fixed radius and
        // altitude computed in updateOrbitParams().  OrbitPhase spreads
        // entries around a circle.
        const radius = entry.orbitRadius || 0;
        const a = entry.angle + entry.orbitPhase;
        const offsetX = Math.cos(a) * radius;
        const offsetZ = Math.sin(a) * radius;
        const offsetY = entry.orbitAltitude || 0;
        // Base position derived from the layout target plus orbital offsets.
        const tentativeX = entry.displayX + offsetX;
        const tentativeY = entry.displayY + offsetY;

        // Depth scaling to simulate perspective: cards slightly grow or
        // shrink as they move closer/farther in the Z axis.
        const depthScale = 1 + offsetZ / 1500;
        const hovered = entry.hovered;

        // Determine the desired rotation around the Y axis.  When hovered,
        // cards rotate to face forward (0deg).  Otherwise they spin within a
        // limited range defined per card.
        const targetRotationY = hovered ? 0 : (Math.sin(entry.spinAngle) * entry.spinRange + entry.spinOffset);
        const lerpStrength = hovered ? 0.24 : 0.12;
        entry.rotationY += (targetRotationY - entry.rotationY) * lerpStrength;

        // Calculate a provisional scale.  Hovered cards scale up more to
        // emphasise focus, but never become excessively large or small.
        let scaleVal = entry.scale * depthScale * (hovered ? 1.35 : 1);
        scaleVal = Math.max(0.45, Math.min(scaleVal, 1.0));

        positions.push({
          entry,
          x: tentativeX,
          y: tentativeY,
          z: offsetZ,
          rotationY: entry.rotationY,
          scaleVal
        });
      });

      // Simple repulsion: iterate over pairs of cards and gently push
      // overlapping cards away from each other.  To improve separation
      // stability, perform two passes over the list.  The threshold distance
      // is based on the larger dimension of each card.
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < positions.length; i++) {
          for (let j = i + 1; j < positions.length; j++) {
            const a = positions[i];
            const b = positions[j];
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);
            // Determine a minimum separation based on the average of both
            // cards' widths and heights.  Use the larger of the two to
            // approximate the card's diagonal footprint.  Multiply by a factor
            // slightly less than one to allow a hint of overlap while still
            // preserving separation.
            const avgWidth = ((a.entry.width * a.scaleVal) + (b.entry.width * b.scaleVal)) * 0.5;
            const avgHeight = ((a.entry.height * a.scaleVal) + (b.entry.height * b.scaleVal)) * 0.5;
            const diag = Math.max(avgWidth, avgHeight);
            // Require almost the full diagonal distance between card centers to
            // prevent any visual overlap.  Increasing this factor reduces
            // chances of intersection at the cost of spreading orbits further.
            const minDist = diag;
            if (dist < minDist && dist > 0.0001) {
              const overlap = minDist - dist;
              const shiftX = (dx / dist) * (overlap / 2);
              const shiftY = (dy / dist) * (overlap / 2);
              a.x -= shiftX;
              a.y -= shiftY;
              b.x += shiftX;
              b.y += shiftY;
            } else if (dist === 0) {
              // If two cards occupy exactly the same position, nudge them in random directions
              const angle = Math.random() * TAU;
              const separation = diag * 0.3;
              const nx = Math.cos(angle) * separation;
              const ny = Math.sin(angle) * separation;
              a.x -= nx / 2;
              a.y -= ny / 2;
              b.x += nx / 2;
              b.y += ny / 2;
            }
          }
        }
      }

      // Apply the final positions, scale and rotation to each element.
      positions.forEach((pos) => {
        const { entry, x, y, z, rotationY, scaleVal } = pos;
        entry.element.style.left = `${x}px`;
        entry.element.style.top = `${y}px`;
        // Hovered cards always draw on top of all others.
        entry.element.style.zIndex = entry.hovered ? '10000' : `${Math.round(1000 + z)}`;
        entry.element.style.transform =
          `translate3d(-50%, -50%, ${z}px) rotateY(${rotationY}deg) scale(${scaleVal})`;
      });

      requestAnimationFrame(animate);
    }

    function setMode(next) {
      const isMobile = mobileQuery.matches;

      if (mode === next) {
        mode = 'all';
      } else {
        mode = next;
      }

      buttons.forEach((btn) => {
        const active = btn.dataset.mode === mode;
        btn.dataset.active = active ? 'true' : 'false';
      });

      if (isMobile) {
        renderMobileCards(mode);
        return;
      }

      if (mode === 'medium' || mode === 'experience') {
        layoutGrouped(mode);
      } else {
        layoutAll();
      }
    }

    buttons.forEach((button) => {
      button.dataset.active = 'false';
      button.addEventListener('click', () => {
        const selected = button.dataset.mode;
        setMode(selected);
      });
    });

    window.addEventListener('resize', () => {
      measureCards();
      updateOrbitParams();
      if (!mobileQuery.matches) {
        if (mode === 'medium' || mode === 'experience') {
          layoutGrouped(mode);
        } else {
          layoutAll();
        }
      }
    });

    createToolCards();
    measureCards();
    updateOrbitParams();
    layoutAll();
    requestAnimationFrame(animate);

    function renderMobileCards(currentMode) {
      if (!mobileGrid) return;

      const sections = [];

      if (currentMode === 'medium' || currentMode === 'experience') {
        const key = currentMode === 'medium' ? 'medium' : 'experience';
        const order = MODE_SETTINGS[currentMode].order;

        order.forEach((group) => {
          const items = toolData
            .filter((tool) => tool[key] === group)
            .slice()
            .sort((a, b) => a.name.localeCompare(b.name));

          if (items.length === 0) return;

          const section = document.createElement('section');
          section.className = 'mobile-section';

          const heading = document.createElement('h3');
          heading.textContent = group;
          section.appendChild(heading);

          const grid = document.createElement('div');
          grid.className = 'mobile-tool-grid';

          items.forEach((tool) => grid.appendChild(buildMobileCard(tool)));

          section.appendChild(grid);
          sections.push(section);
        });
      } else {
        const grid = document.createElement('div');
        grid.className = 'mobile-tool-grid';
        const items = toolData.slice().sort((a, b) => a.name.localeCompare(b.name));
        items.forEach((tool) => grid.appendChild(buildMobileCard(tool)));
        sections.push(grid);
      }

      mobileGrid.innerHTML = '';
      sections.forEach((section) => mobileGrid.appendChild(section));
    }

    function buildMobileCard(tool) {
      const card = document.createElement('a');
      card.className = 'mobile-card';
      card.href = tool.link;
      card.setAttribute('title', `${tool.name} — ${tool.medium} · ${tool.experience}`);

      const media = document.createElement('div');
      media.className = 'mobile-card__media';
      const video = document.createElement('video');
      video.muted = true;
      video.loop = true;
      video.autoplay = true;
      video.playsInline = true;
      if (tool.video) {
        video.src = tool.video;
      }
      video.setAttribute('aria-hidden', 'true');
      media.appendChild(video);

      const title = document.createElement('div');
      title.className = 'mobile-card__title';
      title.textContent = tool.name;

      const meta = document.createElement('div');
      meta.className = 'mobile-card__meta';

      const medium = document.createElement('span');
      medium.className = 'mobile-pill';
      medium.textContent = tool.medium;

      const experience = document.createElement('span');
      experience.className = 'mobile-pill';
      experience.textContent = tool.experience;

      meta.appendChild(medium);
      meta.appendChild(experience);

      card.appendChild(media);
      card.appendChild(title);
      card.appendChild(meta);

      return card;
    }

    if (mobileHome && mobileQuery.matches) {
      renderMobileCards(mode);
    }

    mobileQuery.addEventListener('change', (event) => {
      if (event.matches) {
        renderMobileCards(mode);
      } else {
        measureCards();
        updateOrbitParams();
        if (mode === 'medium' || mode === 'experience') {
          layoutGrouped(mode);
        } else {
          layoutAll();
        }
      }
    });

    const konamiSequence = [
      'arrowup',
      'arrowup',
      'arrowdown',
      'arrowdown',
      'arrowleft',
      'arrowright',
      'arrowleft',
      'arrowright',
      'b',
      'a',
      'enter'
    ];

    const secretPhrases = [
      'Glowing Circuit',
      'Phantom Frequency',
      'Holographic Taffy',
      'Parallel Pizza',
      'Infinite Origami',
      'Soft Laser',
      'Rainbow Echo',
      'Kaleido Spiral',
      'Quantum Confetti',
      'Magnetic Bubble',
      'Pixel Breeze',
      'Neon Whisper',
      'Astral Zine',
      'Soda Supernova',
      'Ghost in the Gelatin'
    ];

    const secretOverlay = document.getElementById('secretOverlay');
    const secretMessage = document.getElementById('secretMessage');
    const keyBuffer = [];

    function setSecretMessage() {
      if (!secretMessage) return;
      const phrase = secretPhrases[Math.floor(Math.random() * secretPhrases.length)];
      secretMessage.textContent = phrase;
    }

    function openSecretTool() {
      if (!secretOverlay) return;
      setSecretMessage();
      secretOverlay.classList.add('is-active');
      secretOverlay.setAttribute('aria-hidden', 'false');
    }

    function closeSecretTool() {
      if (!secretOverlay) return;
      secretOverlay.classList.remove('is-active');
      secretOverlay.setAttribute('aria-hidden', 'true');
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      keyBuffer.push(key);
      if (keyBuffer.length > konamiSequence.length) {
        keyBuffer.shift();
      }

      const isKonami =
        keyBuffer.length === konamiSequence.length &&
        konamiSequence.every((value, index) => value === keyBuffer[index]);

      if (isKonami) {
        openSecretTool();
      }

      if (event.key === 'Escape' && secretOverlay?.classList.contains('is-active')) {
        closeSecretTool();
      }
    });

    secretOverlay?.addEventListener('click', () => {
      setSecretMessage();
    });

  </script>
</body>
</html>
