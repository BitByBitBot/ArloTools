<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArloTools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #fefdf8;
      --panel-strong: #f9f6ef;
      --text: #0f0f0f;
      --border: #0f0f0f;
      --divider: #181818;
      --shadow: rgba(15, 15, 15, 0.18);
      font-family: "Space Mono", "IBM Plex Mono", "Courier New", monospace;
      line-height: 1.4;
      background: var(--bg);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: relative;
    }

    .page-header {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      padding: 16px 34px;
      background: var(--panel);
      border: 2px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      z-index: 3000;
      pointer-events: none;
    }

    .page-header h1 {
      font-size: clamp(1.35rem, 2vw + 0.8rem, 2.2rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-header p {
      margin-top: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    #universe {
      position: absolute;
      inset: 0;
      overflow: hidden;
      perspective: 1600px;
      background: radial-gradient(circle at 20% 20%, #f0f0f0 0%, transparent 40%),
                  radial-gradient(circle at 80% 30%, #f7f7f7 0%, transparent 45%),
                  var(--bg);
    }

    #orbit-field {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .tool-node {
      position: absolute;
      top: 0;
      left: 0;
      padding: 12px 18px;
      border: 2px solid var(--node-color, var(--border));
      background: var(--panel);
      color: inherit;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: clamp(0.62rem, 0.55rem + 0.3vw, 0.82rem);
      cursor: pointer;
      transform-origin: center;
      transform-style: preserve-3d;
      transition: box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
      box-shadow: 10px 12px 0 var(--node-color, var(--border));
      min-width: 160px;
    }

    .tool-node::after {
      content: attr(data-category);
      display: block;
      margin-top: 6px;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      opacity: 0.6;
    }

    .tool-node:hover,
    .tool-node:focus {
      outline: none;
      background: var(--panel-strong);
      box-shadow: 12px 14px 0 var(--node-color, var(--border));
    }

    .tool-node.active {
      background: var(--panel-strong);
      box-shadow: 14px 16px 0 var(--node-color, var(--border));
    }

    .tool-node.is-dimmed {
      opacity: 0.28;
    }

    .legend {
      position: fixed;
      left: 28px;
      bottom: 28px;
      display: grid;
      gap: 10px;
      z-index: 2500;
      padding: 16px 18px;
      background: var(--panel);
      border: 2px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      max-width: 260px;
    }

    .legend h2 {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.75rem;
      border-bottom: 2px solid var(--divider);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    .legend-swatch {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
    }

    .filter-box {
      display: grid;
      gap: 8px;
      margin-top: 6px;
    }

    .filter-box label {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .filter-box input {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid var(--border);
      background: var(--panel-strong);
      color: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      outline: none;
    }

    .viewer {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: clamp(280px, 32vw, 460px);
      height: clamp(220px, 38vh, 420px);
      background: var(--panel);
      border: 2px solid var(--border);
      box-shadow: 10px 10px 0 var(--border);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 2600;
    }

    .viewer.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .viewer .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 2px solid var(--divider);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.8rem;
    }

    .viewer .toolbar a {
      color: inherit;
      text-decoration: none;
      border: 2px solid var(--border);
      padding: 4px 8px;
      background: var(--panel-strong);
      box-shadow: 4px 4px 0 var(--border);
      font-size: 0.75rem;
    }

    .viewer .toolbar a.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    #tool-frame {
      flex: 1;
      border: none;
      background: var(--panel-strong);
      width: 100%;
      height: 100%;
    }

    @media (max-width: 920px) {
      .legend {
        left: 16px;
        bottom: auto;
        top: 16px;
      }

      .viewer {
        right: 16px;
        width: min(90vw, 420px);
      }

      .page-header {
        top: 16px;
        padding: 12px 18px;
      }

      .tool-node {
        min-width: 140px;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>ArloTools Orbital Desk</h1>
    <p>Catch a satellite to launch a tool.</p>
  </header>
  <div id="universe">
    <div id="orbit-field" aria-live="polite"></div>
  </div>
  <aside class="legend" aria-label="Tool categories">
    <h2>Constellations</h2>
    <div id="legend-items"></div>
    <div class="filter-box">
      <label for="search">Filter</label>
      <input id="search" type="search" placeholder="Type to highlight" autocomplete="off">
    </div>
  </aside>
  <section class="viewer" id="viewer">
    <div class="toolbar">
      <span id="tool-name">Choose a tool</span>
      <a id="open-new-tab" class="disabled" href="#" target="_blank" rel="noopener">↗</a>
    </div>
    <iframe id="tool-frame" title="Selected tool" hidden></iframe>
  </section>
  <script>
    window.toolManifest = [
      { name: 'Archive Roulette', file: 'tools/archive_shuffle.html', category: 'Generators' },
      { name: 'Boid Simulator', file: 'tools/boids.html', category: 'Simulations' },
      { name: 'Border Tool', file: 'tools/medieval_border_generator.html', category: 'Generators' },
      { name: 'Chisel Tool', file: 'tools/chisel_pen.html', category: 'Drawing' },
      { name: 'Colorspace Visualizer', file: 'tools/3_d_color_space.html', category: 'Visualizers' },
      { name: 'Fractal Explorer', file: 'tools/Fractal_Lab.html', category: 'Visualizers' },
      { name: 'Heart Generator', file: 'tools/I_<3_WIKI.html', category: 'Generators' },
      { name: 'Game of Life Variations', file: 'tools/graded_game_of_life.html', category: 'Simulations' },
      { name: 'Lissajous Visualizer', file: 'tools/lissajous_figure_grid.html', category: 'Visualizers' },
      { name: 'Modern Grid Generator', file: 'tools/auto_modern_grid_layout.html', category: 'Generators' },
      { name: 'Neumes Converter', file: 'tools/midi_→_neumes_converter.html', category: 'Converters' },
      { name: 'Node Tool', file: 'tools/Node_Net.html', category: 'Drawing' },
      { name: 'Skewer Tool', file: 'tools/GlitchSkewer.html', category: 'Drawing' },
      { name: 'Spectrogram Collage', file: 'tools/Spectrogram_Collage.html', category: 'Audio & Light' },
      { name: 'Spectrogram JPEG Tool', file: 'tools/SpectroJPEG.html', category: 'Audio & Light' },
      { name: 'Tiler Tool', file: 'tools/square_tiler.html', category: 'Generators' },
      { name: 'Tree Generator', file: 'tools/tree_generator.html', category: 'Generators' }
    ];
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tools = Array.isArray(window.toolManifest) ? window.toolManifest : [];
      const orbitField = document.getElementById('orbit-field');
      const legendContainer = document.getElementById('legend-items');
      const searchInput = document.getElementById('search');
      const iframe = document.getElementById('tool-frame');
      const toolName = document.getElementById('tool-name');
      const openNewTab = document.getElementById('open-new-tab');
      const viewer = document.getElementById('viewer');

      const categoryList = Array.from(new Set(tools.map(tool => tool.category)));
      const palette = ['#121212', '#ed004f', '#2c7bc0', '#f69223', '#8e3ffd', '#0a9e82'];
      const categories = categoryList.map((name, index) => ({
        name,
        color: palette[index % palette.length],
        angle: (Math.PI * 2 / categoryList.length) * index,
        speed: 0.18 + (index % 3) * 0.04,
        spin: Math.random() * Math.PI * 2,
        spinSpeed: 0.9 + Math.random() * 0.4,
        nodes: []
      }));

      const toUrl = (file) => encodeURI(file).replace(/#/g, '%23');

      const disableExternalLink = () => {
        openNewTab.classList.add('disabled');
        openNewTab.setAttribute('aria-disabled', 'true');
        openNewTab.href = '#';
      };

      const enableExternalLink = (url) => {
        openNewTab.classList.remove('disabled');
        openNewTab.removeAttribute('aria-disabled');
        openNewTab.href = url;
      };

      disableExternalLink();

      const injectTheme = (doc) => {
        if (!doc) return;
        const link = doc.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'theme.css';
        doc.head.appendChild(link);
      };

      let activeNode = null;

      const selectTool = (tool, node) => {
        if (activeNode) {
          activeNode.classList.remove('active');
        }
        activeNode = node;
        node.classList.add('active');

        const url = toUrl(tool.file);
        iframe.hidden = false;
        iframe.src = url;
        toolName.textContent = tool.name;
        enableExternalLink(url);
        viewer.classList.add('is-visible');

        iframe.addEventListener('load', () => {
          try {
            injectTheme(iframe.contentDocument);
          } catch (error) {
            console.warn('Could not inject theme:', error);
          }
        }, { once: true });
      };

      tools.forEach((tool) => {
        const node = document.createElement('button');
        node.type = 'button';
        node.className = 'tool-node';
        node.textContent = tool.name;
        node.dataset.category = tool.category;
        node.setAttribute('aria-label', `${tool.name} — ${tool.category}`);

        const category = categories.find(entry => entry.name === tool.category);
        if (category) {
          node.style.setProperty('--node-color', category.color);
        }

        node.addEventListener('click', () => selectTool(tool, node));
        orbitField.appendChild(node);

        if (category) {
          category.nodes.push(node);
        }

        tool.node = node;
      });

      const createLegend = () => {
        legendContainer.innerHTML = '';
        categories.forEach((category) => {
          const item = document.createElement('div');
          item.className = 'legend-item';
          const swatch = document.createElement('span');
          swatch.className = 'legend-swatch';
          swatch.style.background = category.color;
          swatch.style.boxShadow = `3px 3px 0 ${category.color}`;
          swatch.setAttribute('aria-hidden', 'true');

          const label = document.createElement('span');
          label.textContent = category.name;

          item.append(swatch, label);
          legendContainer.appendChild(item);
        });
      };

      createLegend();

      const applyFilter = () => {
        const query = searchInput.value.trim().toLowerCase();
        tools.forEach((tool) => {
          const match = tool.name.toLowerCase().includes(query);
          tool.node.classList.toggle('is-dimmed', Boolean(query) && !match);
        });
      };

      searchInput.addEventListener('input', applyFilter);

      const animationState = {
        lastTime: performance.now()
      };

      const animate = (time) => {
        const delta = (time - animationState.lastTime) / 1000;
        animationState.lastTime = time;

        const width = orbitField.clientWidth;
        const height = orbitField.clientHeight;
        const centerX = width / 2;
        const centerY = height / 2;
        const globalRadius = Math.min(width, height) * 0.28;

        categories.forEach((category, index) => {
          category.angle += category.speed * delta;
          category.spin += category.spinSpeed * delta;

          const depthSwing = 260 + index * 22;
          const baseRadius = globalRadius + index * 36;

          const cx = centerX + Math.cos(category.angle) * baseRadius;
          const cy = centerY + Math.sin(category.angle) * baseRadius * 0.55;
          const cz = Math.sin(category.angle * 0.9) * depthSwing;

          const nodes = category.nodes;
          const visibleCount = nodes.length || 1;
          const localRadius = 120 + visibleCount * 12;

          nodes.forEach((node, nodeIndex) => {
            const nodeAngle = category.spin + (nodeIndex / visibleCount) * Math.PI * 2;
            const nx = cx + Math.cos(nodeAngle) * localRadius;
            const ny = cy + Math.sin(nodeAngle) * localRadius * 0.65;
            const nz = cz + Math.cos(nodeAngle * 1.8) * 90;

            const scale = 1 + (nz / 900);
            const depth = Math.round(1000 + nz);

            node.style.transform = `translate3d(${nx}px, ${ny}px, ${nz}px) translate(-50%, -50%) scale(${scale})`;
            node.style.zIndex = depth;
          });
        });

        requestAnimationFrame(animate);
      };

      requestAnimationFrame(animate);

      const params = new URLSearchParams(window.location.search);
      const initialFile = params.get('tool');
      if (initialFile) {
        const initialTool = tools.find((tool) => tool.file === initialFile || tool.file.endsWith(initialFile.split('/').pop()));
        if (initialTool && initialTool.node) {
          selectTool(initialTool, initialTool.node);
        } else {
          const url = toUrl(initialFile);
          iframe.hidden = false;
          iframe.src = url;
          toolName.textContent = initialFile.split('/').pop();
          enableExternalLink(url);
          viewer.classList.add('is-visible');
        }
      }
    });
  </script>
</body>
</html>
